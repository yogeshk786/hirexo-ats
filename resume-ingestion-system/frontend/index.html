<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Ingestion Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .expand-transition {
            transition: all 0.3s ease-in-out;
        }
        /* Custom scrollbar for a cleaner look next to the PDF */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-[1400px] mx-auto w-full">
        
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-8 border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 mb-1">Talent Vault 🚀</h1>
                <p class="text-slate-500 text-sm">Search your automated MongoDB database for candidates.</p>
            </div>
            
            <div class="flex gap-3 w-full md:w-1/2">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search skills, names, keywords..." 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm shadow-sm transition-all"
                    onkeypress="if(event.key === 'Enter') searchCandidates()"
                >
                <button 
                    onclick="searchCandidates()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold transition-colors shadow-sm whitespace-nowrap"
                >
                    Search
                </button>
            </div>
        </div>

        <div id="loading" class="hidden text-center py-20">
            <div class="inline-block animate-spin w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full"></div>
            <p class="text-slate-500 mt-4 font-medium">Fetching candidates from the vault...</p>
        </div>

        <div id="resultsGrid" class="grid grid-cols-1 gap-6"></div>

        <div id="emptyState" class="text-center py-24 hidden bg-white rounded-2xl border-2 border-dashed border-slate-300">
            <div class="text-5xl mb-4">📂</div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2">No candidates found</h3>
            <p class="text-slate-500">Try adjusting your search terms or running the Python ingestion script.</p>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/api/search";

        window.onload = () => searchCandidates();

        function calculateExperience(workArray) {
            if (!Array.isArray(workArray) || workArray.length === 0) return 0;
            
            let allYears = [];
            let isCurrentlyWorking = false;

            workArray.forEach(job => {
                const dateStr = (job.duration || job.date || "").toLowerCase();
                
                if (dateStr.includes('present') || dateStr.includes('current') || dateStr.includes('now')) {
                    isCurrentlyWorking = true;
                }

                const foundYears = dateStr.match(/\b(19|20)\d{2}\b/g);
                if (foundYears) foundYears.forEach(y => allYears.push(parseInt(y, 10)));
            });

            if (allYears.length === 0) return 0;

            const startYear = Math.min(...allYears);
            const endYear = isCurrentlyWorking ? new Date().getFullYear() : Math.max(...allYears);

            let totalYears = endYear - startYear;
            return totalYears === 0 ? 1 : totalYears;
        }

        // Updated toggle function to handle lazy loading of PDFs
        window.toggleProfile = function(index) {
            const detailsDiv = document.getElementById(`details-${index}`);
            const btnText = document.getElementById(`btn-text-${index}`);
            const btnIcon = document.getElementById(`btn-icon-${index}`);
            const iframe = document.getElementById(`iframe-${index}`);
            
            if (detailsDiv.classList.contains('hidden')) {
                detailsDiv.classList.remove('hidden');
                btnText.innerText = 'Hide Profile Dashboard';
                btnIcon.style.transform = 'rotate(180deg)';
                
                // Load PDF inside iframe only when user clicks open
                if (iframe && !iframe.src && iframe.getAttribute('data-src')) {
                    iframe.src = iframe.getAttribute('data-src');
                }
            } else {
                detailsDiv.classList.add('hidden');
                btnText.innerText = 'View Full Profile & PDF';
                btnIcon.style.transform = 'rotate(0deg)';
            }
        };

        async function searchCandidates() {
            const query = document.getElementById('searchInput').value;
            const grid = document.getElementById('resultsGrid');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('emptyState');

            grid.innerHTML = '';
            loading.classList.remove('hidden');
            emptyState.classList.add('hidden');

            try {
                const response = await fetch(`${API_URL}?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                loading.classList.add('hidden');

                if (data.results && data.results.length > 0) {
                    data.results.forEach((candidate, index) => {
                        const card = document.createElement('div');
                        card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 p-6 hover:shadow-md transition-shadow";
                        
                        const generateBadges = (arr, colorClass) => {
                            if (!Array.isArray(arr) || arr.length === 0) return `<span class="text-xs italic text-slate-400">None listed</span>`;
                            return arr.map(item => `<span class="px-3 py-1 ${colorClass} text-xs font-bold rounded-lg border border-opacity-50">${item}</span>`).join('');
                        };

                        const generateList = (arr, icon) => {
                            if (!Array.isArray(arr) || arr.length === 0) return `<div class="text-sm italic text-slate-400">None listed</div>`;
                            return `<ul class="space-y-2">` + arr.map(item => `<li class="text-sm text-slate-600 flex items-start leading-relaxed"><span class="mr-2 text-slate-400">${icon}</span> <span>${item}</span></li>`).join('') + `</ul>`;
                        };

                        const generateEducation = (arr) => {
                            if (!Array.isArray(arr) || arr.length === 0) return `<div class="text-sm italic text-slate-400">None listed</div>`;
                            return arr.map(edu => `
                                <div class="mb-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <div class="font-bold text-slate-900 text-sm leading-tight">${edu.degree || 'Degree Unknown'}</div>
                                    <div class="text-slate-600 text-xs mt-1">${edu.institution || 'Institution Unknown'}</div>
                                    <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-200">
                                        <div class="text-slate-500 text-xs font-medium">${edu.year || 'Date Unknown'}</div>
                                        ${edu.score ? `<div class="text-blue-700 text-xs font-bold bg-blue-100 px-2 py-1 rounded shadow-sm">${edu.score}</div>` : '<div></div>'}
                                    </div>
                                </div>
                            `).join('');
                        };

                        const generateWork = (arr) => {
                            if (!Array.isArray(arr) || arr.length === 0) return `<div class="text-sm italic text-slate-400">None listed</div>`;
                            return arr.map(job => `
                                <div class="mb-4 border-l-2 border-blue-500 pl-4 py-1">
                                    <div class="flex justify-between items-start mb-1">
                                        <div class="font-bold text-slate-900 text-[15px]">${job.job_title || 'Role Not Specified'}</div>
                                        <div class="text-slate-500 text-xs font-bold bg-slate-100 px-2 py-1 rounded">${job.duration || job.date || 'Dates Unknown'}</div>
                                    </div>
                                    <div class="text-blue-600 text-sm font-semibold mb-2">${job.company || 'Company Unknown'}</div>
                                    ${job.description ? `<div class="text-slate-600 text-sm leading-relaxed">${job.description}</div>` : ''}
                                </div>
                            `).join('');
                        };

                        const totalExp = calculateExperience(candidate.work_experience);

                        card.innerHTML = `
                            <div class="flex flex-col md:flex-row justify-between items-start gap-4">
                                <div class="flex-1">
                                    <div class="flex items-center gap-3 mb-1">
                                        <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">${candidate.name || 'Unknown Candidate'}</h2>
                                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded-md border border-blue-200">
                                            ${totalExp} YRS EXP
                                        </span>
                                    </div>
                                    <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-1 text-sm font-medium text-slate-500">
                                        <span class="flex items-center gap-1">✉️ ${candidate.email || 'No Email'}</span>
                                        <span class="flex items-center gap-1">📱 ${candidate.phone || 'No Phone'}</span>
                                        <span class="flex items-center gap-1">📍 ${candidate.location || 'Location Unknown'}</span>
                                    </div>
                                    
                                    ${candidate.summary ? `
                                        <p class="text-slate-600 text-sm leading-relaxed mt-4 line-clamp-2">${candidate.summary}</p>
                                    ` : ''}
                                </div>
                                
                                ${candidate.resume_url ? `
                                    <a href="https://docs.google.com/gview?url=${encodeURIComponent(candidate.resume_url)}" target="_blank" class="shrink-0 flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold px-5 py-2.5 rounded-xl transition-colors shadow-sm">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                        Open PDF Tab
                                    </a>
                                ` : ''}
                            </div>

                            <div id="details-${index}" class="hidden mt-6 pt-6 border-t border-slate-100 expand-transition">
                                <div class="flex flex-col lg:flex-row gap-8">
                                    
                                    <div class="w-full lg:w-1/2 flex flex-col gap-6 h-[750px] overflow-y-auto pr-2">
                                        <div class="bg-slate-50 p-5 rounded-xl border border-slate-100">
                                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">💻 Technical Skills</h4>
                                            <div class="flex flex-wrap gap-2 mb-6">
                                                ${generateBadges(candidate.technical_skills, 'bg-white text-slate-800 border-slate-200 shadow-sm')}
                                            </div>

                                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">🤝 Soft Skills & 🌍 Languages</h4>
                                            <div class="flex flex-wrap gap-2 mb-6">
                                                ${generateBadges(candidate.soft_skills, 'bg-white text-slate-800 border-slate-200 shadow-sm')}
                                                ${generateBadges(candidate.languages, 'bg-slate-200 text-slate-700 border-slate-300')}
                                            </div>

                                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">🎯 Core Focus</h4>
                                            <div class="flex flex-wrap gap-2">
                                                ${generateBadges(candidate.interests, 'bg-indigo-50 text-indigo-700 border-indigo-200 shadow-sm')}
                                            </div>
                                        </div>

                                        <div>
                                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">💼 Work Experience</h4>
                                            ${generateWork(candidate.work_experience)}
                                        </div>

                                        <div>
                                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">🚀 Projects</h4>
                                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                ${generateList(candidate.projects, '▹')}
                                            </div>
                                        </div>

                                        <div>
                                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">🎓 Education</h4>
                                            ${generateEducation(candidate.education)}
                                        </div>
                                    </div>

                                    <div class="w-full lg:w-1/2 h-[750px]">
                                        ${candidate.resume_url ? `
                                            <div class="w-full h-full bg-slate-900 rounded-xl overflow-hidden shadow-inner border border-slate-300">
                                                <iframe 
                                                    id="iframe-${index}"
                                                    data-src="https://docs.google.com/gview?url=${encodeURIComponent(candidate.resume_url)}&embedded=true" 
                                                    class="w-full h-full border-none rounded-xl bg-white"
                                                    title="${candidate.name} Original Resume">
                                                </iframe>
                                            </div>
                                        ` : `
                                            <div class="w-full h-full flex flex-col items-center justify-center bg-slate-50 rounded-xl border-2 border-dashed border-slate-300">
                                                <div class="text-6xl mb-4 text-slate-300">📄</div>
                                                <h4 class="text-lg font-bold text-slate-500 mb-1">No Cloud Document Found</h4>
                                                <p class="text-sm text-slate-400">This candidate was processed before Supabase was connected.</p>
                                            </div>
                                        `}
                                    </div>

                                </div>
                            </div>

                            <button 
                                onclick="toggleProfile(${index})" 
                                class="w-full mt-6 pt-4 border-t border-slate-100 text-sm font-bold text-blue-600 hover:text-blue-800 flex justify-center items-center gap-2 transition-colors"
                            >
                                <span id="btn-text-${index}">View Full Profile & PDF</span>
                                <svg id="btn-icon-${index}" class="w-4 h-4 expand-transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    emptyState.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Error fetching candidates:", error);
                loading.classList.add('hidden');
                alert("Could not connect to the backend. Make sure your Uvicorn server is running at http://127.0.0.1:8000 !");
            }
        }
    </script>
</body>
</html>
